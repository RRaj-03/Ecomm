services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomm-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ecomm
      POSTGRES_PASSWORD: ecomm_dev
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomm -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
