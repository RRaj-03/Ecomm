name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./ecommerce-admin
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ecommerce-admin:latest
          build-args: |
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_ADMIN }}
            FRONTEND_STORE_URL=${{ secrets.FRONTEND_STORE_URL }}
            STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            NEXT_PUBLIC_API_URL_ADMIN=${{ secrets.NEXT_PUBLIC_API_URL_ADMIN }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/
            NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/

      - name: Build and push Store Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./ecommerce-store
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ecommerce-store:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STORE }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_STORE }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL=/
            NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL=/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Navigate to app dir
            cd /home/ec2-user/app

            # Update docker-compose from repo (or just re-pull if relying on file)
            # Assuming we scp the compose file or pull the repo. 
            # Simplest approach: create/update docker-compose.yml content or pull repo.
            # Here we'll assuming the repo is pulled or we just run pull commands if compose file is static.
            # For robustness, let's pull the latest compose file or just git pull if it's a git repo.
            if [ -d ".git" ]; then
              git pull origin main
            else
              # Fallback: Just pull images
              echo "Not a git repo, proceeding to pull images..."
            fi

            # Pull latest images
            docker-compose pull

            # Restart containers
            docker-compose up -d
